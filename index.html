<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrera Loca</title>
<style>
body{margin:0;overflow:hidden;background:#8fd3ff;font-family:system-ui,sans-serif}
#h{position:fixed;top:14px;left:0;right:0;text-align:center;font:800 34px system-ui;color:#fff;text-shadow:0 3px 8px #0006;pointer-events:none}
#r{position:fixed;top:14px;right:14px;color:#fff;font:600 15px system-ui;text-shadow:0 1px 4px #000;text-align:right;pointer-events:none}
#c{position:fixed;bottom:12px;left:12px;color:#fff;font:13px system-ui;text-shadow:0 1px 3px #000}
</style></head><body>
<div id="h"></div><div id="r"></div><div id="c">WASD / flechas: mover · Espacio: saltar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Vacío = mismo host que sirve la página. Si alojas el HTML en GitHub Pages,
// pon aquí la URL del servidor, ej: 'wss://mi-juego.onrender.com'
const SERVER = '';
const wsUrl = SERVER || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

const PL = [0, -21, -42, -63, -84], PW = 12, PD = 16;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 40, 130);
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 250);
const R = new THREE.WebGLRenderer({ antialias: true });
R.setSize(innerWidth, innerHeight);
document.body.appendChild(R.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x7090b0, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, .6); sun.position.set(10, 30, 10); scene.add(sun);

PL.forEach((z, i) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(PW, 1, PD),
    new THREE.MeshLambertMaterial({ color: i == 4 ? 0xffd54a : i % 2 ? 0xff86b0 : 0x86d6ff }));
  m.position.set(0, -.5, z); scene.add(m);
});
const bars = [[1, 1.2], [2, -1.6], [3, 2]].map(([i, s]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(10, 1, .6), new THREE.MeshLambertMaterial({ color: 0xff3d3d }));
  m.position.set(0, .5, PL[i]); scene.add(m);
  return { m, z: PL[i], s, a: 0 };
});

function avatar(color, name) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(.5, 20, 16), new THREE.MeshLambertMaterial({ color }));
  b.scale.set(1, 1.3, 1); g.add(b);
  [-.17, .17].forEach(x => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    e.position.set(x, .3, .4); g.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    p.position.set(x, .3, .5); g.add(p);
  });
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const cx = cv.getContext('2d'); cx.font = '700 36px system-ui'; cx.textAlign = 'center';
  cx.lineWidth = 6; cx.strokeStyle = '#000a'; cx.strokeText(name, 128, 44);
  cx.fillStyle = '#fff'; cx.fillText(name, 128, 44);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  s.scale.set(2.4, .6, 1); s.position.y = 1.3; g.add(s);
  return g;
}

// ---- Estado
const me = { x: 0, y: 1, z: 4, vx: 0, vy: 0, vz: 0, g: false, cp: 0, ry: 0 };
let myId = null, mine = null, phase = 'lobby', el = 0, results = [], fin = false, off = 0;
const others = new Map(), k = {};
addEventListener('keydown', e => { k[e.code] = 1; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => k[e.code] = 0);
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

// ---- Red
const name = (prompt('Tu nombre:') || '').slice(0, 12) || 'Anónimo';
const ws = new WebSocket(wsUrl);
const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onopen = () => send({ t: 'join', name });
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.t === 'welcome') { myId = d.id; mine = avatar(d.color, name); scene.add(mine); toStart(); }
  if (d.t !== 's') return;
  off = d.now - Date.now(); el = d.el; results = d.results;
  if (d.phase !== phase) { phase = d.phase; fin = false; if (phase === 'countdown') toStart(); }
  const seen = new Set();
  d.players.forEach(p => {
    if (p.id === myId) return;
    seen.add(p.id);
    let a = others.get(p.id);
    if (!a) { a = avatar(p.color, p.name); a.position.set(p.x, p.y + .65, p.z); scene.add(a); others.set(p.id, a); }
    a.tg = p;
  });
  others.forEach((a, id) => { if (!seen.has(id)) { scene.remove(a); others.delete(id); } });
};
setInterval(() => send({ t: 'pos', x: me.x, y: me.y, z: me.z, ry: me.ry }), 50);

function toStart() {
  me.x = (((myId || 0) % 6) - 2.5) * 1.6; me.z = 4; me.y = 1;
  me.vx = me.vy = me.vz = 0; me.cp = 0;
}

// ---- Física
function step(dt) {
  const now = (Date.now() + off) / 1000;
  bars.forEach(b => { b.a = now * b.s; b.m.rotation.y = -b.a; });
  const live = phase !== 'countdown';
  let ix = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  let iz = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
  if (!live) ix = iz = 0;
  const l = Math.hypot(ix, iz) || 1, c = Math.min(1, dt * (me.g ? 8 : 2.5));
  me.vx += (ix / l * 9 - me.vx) * c; me.vz += (iz / l * 9 - me.vz) * c;
  if (live && k.Space && me.g) { me.vy = 11; me.g = false; }
  me.vy -= 28 * dt;
  me.x += me.vx * dt; me.y += me.vy * dt; me.z += me.vz * dt;
  const pi = PL.findIndex(z => Math.abs(me.x) < PW / 2 && Math.abs(me.z - z) < PD / 2);
  me.g = false;
  if (pi >= 0 && me.y <= 0 && me.y > -.7 && me.vy <= 0) { me.y = 0; me.vy = 0; me.g = true; me.cp = pi; }
  if (live) bars.forEach(b => {
    const pz = me.z - b.z, ux = Math.cos(b.a), uz = Math.sin(b.a);
    const t = Math.max(-5, Math.min(5, me.x * ux + pz * uz));
    const dx = me.x - ux * t, dz = pz - uz * t, d = Math.hypot(dx, dz);
    if (d < .9 && me.y < 1) { me.vx = dx / (d || 1) * 16; me.vz = dz / (d || 1) * 16; me.vy = Math.max(me.vy, 5); }
  });
  if (me.y < -15) { me.x = 0; me.z = PL[me.cp]; me.y = 1; me.vx = me.vy = me.vz = 0; }
  if (phase === 'go' && me.z < -82 && !fin) { fin = true; send({ t: 'finish' }); }
  if (Math.hypot(me.vx, me.vz) > .5) me.ry = Math.atan2(me.vx, me.vz);
}

function hud() {
  const h = document.getElementById('h');
  h.textContent = !mine ? 'Conectando…'
    : phase === 'lobby' ? 'Esperando jugadores…'
    : phase === 'countdown' ? Math.ceil(5 - el)
    : phase === 'go' ? (el < 1.5 ? '¡YA!' : el.toFixed(1) + ' s')
    : 'Resultados';
  document.getElementById('r').innerHTML = results.map((r, i) => (i + 1) + '. ' + r.name.replace(/</g, '&lt;') + ' — ' + r.time + ' s').join('<br>');
}

let last = performance.now();
(function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  step(dt); hud();
  if (mine) { mine.position.set(me.x, me.y + .65, me.z); mine.rotation.y = me.ry; }
  others.forEach(a => {
    if (!a.tg) return;
    a.position.lerp(new THREE.Vector3(a.tg.x, a.tg.y + .65, a.tg.z), .3);
    a.rotation.y = a.tg.ry;
  });
  cam.position.lerp(new THREE.Vector3(me.x * .6, me.y + 7, me.z + 11), .08);
  cam.lookAt(me.x * .6, me.y + 1, me.z - 6);
  R.render(scene, cam);
})(last);
</script></body></html>
