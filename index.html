<script>
(() => {
const SERVER = '';
const wsUrl = SERVER || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
const S = .1, X = p => (p - 322) * S, Z = p => (p - 325) * S;   // plano (px) -> metros

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe6f6ff, 80, 200);
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 300);
const R = new THREE.WebGLRenderer({ antialias: true });
R.setSize(innerWidth, innerHeight); R.setPixelRatio(Math.min(devicePixelRatio, 2));

const sun = new THREE.DirectionalLight(0xfff0d0, .7);

const M = c => new THREE.MeshLambertMaterial({ color: c });
function tex(draw, w, h, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}

// ---- Cielo, nubes, pasto
const skyG = new THREE.Group(); scene.add(skyG);
skyG.add(new THREE.Mesh(new THREE.SphereGeometry(220, 16, 12), new THREE.MeshBasicMaterial({
  map: tex((x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#6cc4ff'); g.addColorStop(.55, '#bdeaff'); g.addColorStop(.85, '#fff0d2'); g.addColorStop(1, '#ffe2b8'); x.fillStyle = g; x.fillRect(0, 0, w, h); }, 2, 256),
  side: THREE.BackSide, fog: false, depthWrite: false })));
const sb = new THREE.Mesh(new THREE.SphereGeometry(12, 20, 14), new THREE.MeshBasicMaterial({ color: 0xfff3b0, fog: false })); sb.position.set(80, 85, -130); skyG.add(sb);
const clouds = [];
for (let i = 0; i < 16; i++) {
  const g = new THREE.Group(), s = 2.5 + Math.random() * 3;
  for (let j = 0; j < 4; j++) { const b = new THREE.Mesh(new THREE.SphereGeometry(s * (.6 + Math.random() * .5), 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); b.position.set(j * s * .9 - s * 1.4, Math.random() * s * .3, 0); b.scale.y = .65; g.add(b); }
  g.position.set((Math.random() - .5) * 220, 30 + Math.random() * 20, (Math.random() - .5) * 200); scene.add(g); clouds.push(g);
}
const grass = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ map: tex((x, w, h) => { x.fillStyle = '#9fe08a'; x.fillRect(0, 0, w, h); x.fillStyle = '#92d67d'; x.fillRect(0, 0, w / 2, h / 2); x.fillRect(w / 2, h / 2, w / 2, h / 2); }, 64, 64, 150, 150) }));
grass.rotation.x = -Math.PI / 2; grass.position.y = -.5; grass.receiveShadow = true; scene.add(grass);

function tree(x, z, k) {
  const g = new THREE.Group(), t = new THREE.Mesh(new THREE.CylinderGeometry(.3, .45, 2.2, 8), M(0x9a6b45)); t.position.y = 1.1; g.add(t);
  const lc = [0x5fcf7a, 0x4fbf6a, 0xffb3cf, 0xffc27a][k % 4];
  [[0, 3.3, 0, 1.9], [.9, 2.8, .3, 1.3], [-.8, 2.9, -.3, 1.4]].forEach(([a, b, c, r]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), M(lc)); s.position.set(a, b, c); g.add(s); });
  g.traverse(o => o.castShadow = true); g.position.set(x, -.5, z); g.scale.setScalar(.9 + (k % 3) * .2); scene.add(g);
}
for (let i = 0; i < 26; i++) { const a = i * 2.4, r = 38 + (i * 7 % 16); tree(Math.cos(a) * r * 1.02, Math.sin(a) * r * 1.02, i); }
const fl = [0xff7ab0, 0xffd54a, 0xffffff, 0xb78bff];
for (let i = 0; i < 90; i++) { const a = i * 1.7, r = 34 + (i * 13 % 30); const f = new THREE.Mesh(new THREE.SphereGeometry(.18, 6, 5), M(fl[i % 4])); f.position.set(Math.cos(a) * r, -.3, Math.sin(a) * r); scene.add(f); }

// ---- Edificio y mobiliario (coordenadas del plano)
const cols = [];
function box(x1, y1, x2, y2, h, color, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry((x2 - x1) * S, h, (y2 - y1) * S), o.mat || M(color));
  m.position.set(X((x1 + x2) / 2), (o.y || 0) + h / 2, Z((y1 + y2) / 2)); m.castShadow = m.receiveShadow = true; scene.add(m);
  if (o.col !== false) cols.push([X(x1), Z(y1), X(x2), Z(y2)]);
  return m;
}
function rug(x1, y1, x2, y2, c) { const m = new THREE.Mesh(new THREE.PlaneGeometry((x2 - x1) * S, (y2 - y1) * S), M(c)); m.rotation.x = -Math.PI / 2; m.position.set(X((x1 + x2) / 2), .03, Z((y1 + y2) / 2)); m.receiveShadow = true; scene.add(m); }
function sign(txt, px, py, y) {

  x.font = '700 40px Fredoka,system-ui'; x.textAlign = 'center'; x.fillStyle = '#fffd'; x.fillRect(0, 8, 384, 64); x.fillStyle = '#5a4636'; x.fillText(txt, 192, 54);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) })); s.scale.set(4.8, 1, 1); s.position.set(X(px), y, Z(py)); scene.add(s);
}
const floorW = 565 * S, floorD = 570 * S;
const slab = new THREE.Mesh(new THREE.BoxGeometry(floorW + .8, .5, floorD + .8), M(0xe7c79a)); slab.position.set(X(322.5), -.25, Z(325)); slab.receiveShadow = true; scene.add(slab);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(floorW, floorD), new THREE.MeshLambertMaterial({ map: tex((x, w, h) => {
  const c = ['#f0d3aa', '#e8c89c', '#f4dab4', '#e2bf91']; for (let i = 0; i < 4; i++) { x.fillStyle = c[i]; x.fillRect(0, i * h / 4, w, h / 4); x.fillStyle = '#0001'; x.fillRect(0, i * h / 4, w, 2); x.fillRect((i * 37) % w, i * h / 4, 2, h / 4); } }, 128, 128, floorW / 3, floorD / 3) }));
floor.rotation.x = -Math.PI / 2; floor.position.set(X(322.5), .005, Z(325)); floor.receiveShadow = true; scene.add(floor);

const WALL = 0xfff3e0, WH = 1.5;
[[36, 36, 609, 44], [36, 606, 609, 614], [36, 36, 44, 614], [601, 36, 609, 614]].forEach(r => box(...r, WH, WALL));
// salas con puerta
[[118, 40, 122, 110], [228, 40, 232, 110], [122, 106, 172, 110], [200, 106, 228, 110],         // sala 1
 [40, 433, 126, 437], [126, 433, 130, 483], [126, 505, 130, 512], [40, 510, 130, 514],           // sala 2
 [560, 425, 564, 447], [560, 470, 564, 495], [560, 425, 601, 429], [560, 491, 601, 495]          // sala 3
].forEach(r => box(...r, WH, 0xfde0cc));
// núcleo, ascensores, pilares
box(240, 135, 410, 355, 1.7, 0xe6dccb); box(275, 372, 400, 420, 1.9, 0xa9c4dc);
sign('Escaleras y baños', 325, 245, 2.5); sign('Ascensores', 337, 396, 2.8);
[[232, 228, 254, 252], [402, 228, 424, 252], [232, 402, 256, 426], [402, 402, 426, 426], [55, 55, 92, 95], [565, 55, 600, 95], [60, 395, 96, 425], [565, 398, 600, 425], [55, 575, 90, 606], [565, 575, 600, 606]]
  .forEach(r => box(...r, 2.2, 0xc9ced6));
sign('Sala 1', 175, 80, 2.4); sign('Sala 2', 85, 462, 2.4); sign('Sala 3', 582, 440, 2.4);
rug(124, 44, 226, 106, 0xd9c9ff); rug(44, 441, 124, 508, 0xd9c9ff); rug(566, 431, 599, 489, 0xd9c9ff);
rug(140, 128, 240, 305, 0xcfeedd); rug(412, 128, 580, 296, 0xcde8ff); rug(172, 420, 428, 515, 0xffd9e4); rug(262, 44, 395, 116, 0xfff0b8);

const CH = [0xff8a80, 0x6ec6ff, 0xffd166, 0x7bd88f, 0xc39bff];
function desk(x1, y1, x2, y2) {
  box(x1, y1, x2, y2, .75, 0xf2d3a8);
  const hor = (x2 - x1) >= (y2 - y1), len = hor ? x2 - x1 : y2 - y1, n = Math.max(1, Math.round(len / 24));
  for (let i = 0; i < n; i++) {
    const t = (i + .5) / n * len;
    [-1, 1].forEach(s => {
      const cx = hor ? x1 + t : (s < 0 ? x1 - 8 : x2 + 8), cy = hor ? (s < 0 ? y1 - 8 : y2 + 8) : y1 + t;
      const ch = new THREE.Group(), se = new THREE.Mesh(new THREE.CylinderGeometry(.38, .38, .14, 10), M(CH[(i + (s > 0 ? 2 : 0)) % 5])); se.position.y = .5; ch.add(se);
      const bk = new THREE.Mesh(new THREE.BoxGeometry(.7, .6, .1), M(CH[(i + (s > 0 ? 2 : 0)) % 5])); bk.position.set(0, .85, .38); ch.add(bk);
      const st = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .45, 6), M(0x555a66)); st.position.y = .25; ch.add(st);
      ch.position.set(X(cx), 0, Z(cy)); ch.rotation.y = hor ? (s < 0 ? Math.PI : 0) : (s < 0 ? -Math.PI / 2 : Math.PI / 2); scene.add(ch);
      const mx = hor ? x1 + t : (s < 0 ? x1 + 4 : x2 - 4), my = hor ? (s < 0 ? y1 + 4 : y2 - 4) : y1 + t;
      const mo = new THREE.Mesh(new THREE.BoxGeometry(hor ? .55 : .08, .4, hor ? .08 : .55), M(0x2f3542)); mo.position.set(X(mx), 1, Z(my)); scene.add(mo);
    });
  }
}
function rtable(cx, cy, rx, ry, chairs) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .75, 20), M(0xf2d3a8)); t.scale.set(rx * S, 1, ry * S); t.position.set(X(cx), .375, Z(cy)); t.castShadow = true; scene.add(t);
  cols.push([X(cx - rx), Z(cy - ry), X(cx + rx), Z(cy + ry)]);
  for (let i = 0; i < chairs; i++) { const a = i / chairs * Math.PI * 2, c = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .5, 10), M(CH[i % 5])); c.position.set(X(cx) + Math.cos(a) * (rx * S + .6), .25, Z(cy) + Math.sin(a) * (ry * S + .6)); scene.add(c); }
}
function couch(x1, y1, x2, y2, c) { box(x1, y1, x2, y2, .6, c); box(x1, y1, x1 + 7, y2, 1.1, c, { col: false }); }
function plant(px, py) {
  const g = new THREE.Group(), p = new THREE.Mesh(new THREE.CylinderGeometry(.4, .3, .6, 10), M(0xd9825b)); p.position.y = .3; g.add(p);
  [[0, 1.1, 0, .55], [.3, 1.5, .1, .4], [-.3, 1.4, -.1, .42]].forEach(([a, b, c, r]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), M(0x4fbf6a)); s.position.set(a, b, c); g.add(s); });
  g.traverse(o => o.castShadow = true); g.position.set(X(px), 0, Z(py)); scene.add(g); cols.push([X(px) - .4, Z(py) - .4, X(px) + .4, Z(py) + .4]);
}
[[150, 138, 232, 166], [150, 200, 232, 228], [150, 262, 232, 290],
 [425, 140, 500, 166], [508, 140, 562, 166], [425, 200, 500, 226], [508, 200, 562, 226], [425, 260, 500, 286], [508, 260, 562, 286],
 [430, 365, 520, 388], [430, 402, 520, 425],
 [190, 440, 210, 505], [255, 440, 275, 505], [320, 440, 340, 505], [390, 440, 410, 505],
 [175, 555, 225, 573], [245, 555, 295, 573], [315, 555, 365, 573], [385, 555, 435, 573]].forEach(r => desk(...r));
rtable(177, 75, 28, 20, 8); rtable(82, 474, 22, 16, 6); rtable(583, 460, 12, 20, 6);
rtable(305, 82, 11, 11, 4); rtable(355, 82, 11, 11, 4);
couch(55, 128, 85, 170, 0xff9bb6); couch(55, 200, 85, 243, 0x8fd3ff);
box(536, 300, 552, 350, 1.4, 0xe0b98a); box(48, 260, 64, 320, 1.4, 0xe0b98a);
[[100, 320], [470, 470], [250, 110], [500, 330]].forEach(p => plant(...p));

function collide() {
  const r = .45;
  for (const c of cols) {
    const cx = Math.max(c[0], Math.min(me.x, c[2])), cz = Math.max(c[1], Math.min(me.z, c[3])), dx = me.x - cx, dz = me.z - cz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 1e-4) { me.x = cx + dx / d * r; me.z = cz + dz / d * r; }
      else { const l = me.x - c[0], rr = c[2] - me.x, t = me.z - c[1], b = c[3] - me.z, m = Math.min(l, rr, t, b);
        if (m === l) me.x = c[0] - r; else if (m === rr) me.x = c[2] + r; else if (m === t) me.z = c[1] - r; else me.z = c[3] + r; }
    }
  }
}

// ---- Personajes
const HAT = [0xffd54a, 0xff6f9c, 0x35a7ff, 0xff9b3d, 0x7be0b0], ICON = ['', '👋', '🎵', '⭐', '❤️'];
function avatar(color, name, id) {
  const g = new THREE.Group(), col = new THREE.Color(color), u = g.userData;
  u.body = new THREE.Mesh(new THREE.SphereGeometry(.5, 24, 18), M(col)); u.body.scale.set(1, 1.2, 1); u.body.position.y = .78; g.add(u.body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(.38, 16, 12), M(col.clone().offsetHSL(0, 0, .18))); belly.scale.set(1, 1.1, .5); belly.position.set(0, .7, .34); g.add(belly);
  [-.17, .17].forEach(x => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.13, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); e.scale.set(1, 1.2, .6); e.position.set(x, 1.08, .4); g.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0x111111 })); p.position.set(x, 1.08, .47); g.add(p);
  });
  const mo = new THREE.Mesh(new THREE.TorusGeometry(.1, .022, 6, 14, Math.PI), new THREE.MeshBasicMaterial({ color: 0x3a1f1f })); mo.rotation.z = Math.PI; mo.position.set(0, .93, .47); g.add(mo);
  const leg = x => { const p = new THREE.Group(); p.position.set(x, .32, 0); const f = new THREE.Mesh(new THREE.SphereGeometry(.17, 12, 10), M(0x2b2b3a)); f.scale.set(1, .7, 1.4); f.position.set(0, -.2, .06); p.add(f); g.add(p); return p; };
  const arm = x => { const p = new THREE.Group(); p.position.set(x, .98, 0); const h = new THREE.Mesh(new THREE.SphereGeometry(.13, 10, 8), M(col)); h.position.set(x > 0 ? .06 : -.06, -.34, 0); p.add(h); g.add(p); return p; };
  u.legL = leg(-.2); u.legR = leg(.2); u.armL = arm(-.52); u.armR = arm(.52);
  const hc = M(HAT[id % 5]), ht = id % 5;
  if (ht === 1) { const c = new THREE.Mesh(new THREE.ConeGeometry(.22, .55, 12), hc); c.position.set(0, 1.62, 0); c.rotation.z = .15; g.add(c); }
  if (ht === 2) { const a = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .42, 14), M(0x2b2b3a)), b = new THREE.Mesh(new THREE.CylinderGeometry(.38, .38, .05, 16), M(0x2b2b3a)); a.position.y = 1.58; b.position.y = 1.38; g.add(a, b); }
  if (ht === 3) { const s = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .2, 6), M(0x444444)); s.position.y = 1.48; u.prop = new THREE.Group(); u.prop.position.y = 1.6;
    [0, 1].forEach(q => { const bl = new THREE.Mesh(new THREE.BoxGeometry(.7, .03, .12), hc); bl.rotation.y = q * Math.PI / 2; u.prop.add(bl); }); g.add(s, u.prop); }
  if (ht === 4) { const hm = new THREE.Mesh(new THREE.SphereGeometry(.53, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), hc); hm.position.y = 1.12; hm.scale.y = .9; g.add(hm); }
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const cx = cv.getContext('2d');
  cx.font = '700 38px Fredoka,system-ui'; cx.textAlign = 'center'; cx.lineWidth = 7; cx.strokeStyle = '#000a'; cx.strokeText(name, 128, 46); cx.fillStyle = '#fff'; cx.fillText(name, 128, 46);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); sp.scale.set(2.4, .6, 1); sp.position.y = 2.4; g.add(sp);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  u.ph = 0; u.em = 0; u.eT = 0; u.sid = 0; u.eid = 0; u.bT = 0; return g;
}
function anim(a, sp, dt) {
  const u = a.userData; u.ph += dt * (6 + sp * .9);
  const s = Math.min(1, sp / 6), sw = Math.sin(u.ph) * .9 * s;
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * .8; u.armR.rotation.x = sw * .8;
  u.armL.rotation.z = u.armR.rotation.z = 0; u.body.rotation.x = s * .12;
  if (u.prop) u.prop.rotation.y += dt * 20;
}
function startEmote(a, n) {
  const u = a.userData; if (u.icon) a.remove(u.icon);
  const c = document.createElement('canvas'); c.width = c.height = 96; const x = c.getContext('2d'); x.font = '70px serif'; x.textAlign = 'center'; x.fillText(ICON[n], 48, 72);
  u.icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false })); u.icon.scale.set(1, 1, 1); u.icon.position.y = 3; a.add(u.icon);
  u.em = n; u.eT = 0;
}
function setBubble(a, t) {
  const u = a.userData; if (u.bub) a.remove(u.bub);
  const c = document.createElement('canvas'), x = c.getContext('2d'); x.font = '500 34px Fredoka,system-ui';
  const w = Math.min(560, Math.ceil(x.measureText(t).width) + 44); c.width = w; c.height = 70;
  x.font = '500 34px Fredoka,system-ui'; x.fillStyle = '#fffffff2'; x.strokeStyle = '#e9b97c'; x.lineWidth = 4;
  x.beginPath(); x.moveTo(20, 3); x.arcTo(w - 3, 3, w - 3, 60, 20); x.arcTo(w - 3, 60, 3, 60, 20); x.arcTo(3, 60, 3, 3, 20); x.arcTo(3, 3, w - 3, 3, 20); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = '#5a4636'; x.textAlign = 'center'; x.fillText(t, w / 2, 45);
  u.bub = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); u.bub.scale.set(w / 100, .7, 1); u.bub.position.y = 3.7; a.add(u.bub); u.bT = 6;
}
function fx(a, dt) {
  const u = a.userData;
  if (u.em) {
    u.eT += dt; const t = u.eT;
    if (t > 2.4) { a.remove(u.icon); u.icon = null; u.em = 0; }
    else {
      if (u.em === 1) u.armR.rotation.z = 2.3 + Math.sin(t * 14) * .35;
      if (u.em === 2) { a.rotation.y += t * 7; u.armL.rotation.z = -2 + Math.sin(t * 10) * .5; u.armR.rotation.z = 2 + Math.sin(t * 10 + 3) * .5; a.position.y += Math.abs(Math.sin(t * 8)) * .25; }
      if (u.em === 3) a.position.y += Math.abs(Math.sin(t * 7)) * .9;
      u.icon.position.y = 3 + Math.min(t, 1) * .3; u.icon.material.opacity = Math.min(1, (2.4 - t) * 3);
    }
  }
  if (u.bub && (u.bT -= dt) < 0) { a.remove(u.bub); u.bub = null; }
}

// ---- Estado, entrada y red
const me = { x: 0, z: 0, vx: 0, vz: 0, ry: 0 };
let myId = null, mine = null, cy = 0;
const others = new Map(), k = {}, ci = document.getElementById('ci');
function toStart() { me.x = X(190 + (myId % 5) * 18); me.z = Z(360 + ((myId / 5 | 0) % 3) * 18); }
const name = (prompt('Tu nombre:') || '').slice(0, 12) || 'Anónimo';
const ws = new WebSocket(wsUrl), send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onopen = () => send({ t: 'join', name });
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.t === 'welcome') { myId = d.id; mine = avatar(d.color, name, d.id); scene.add(mine); toStart(); }
  if (d.t !== 's') return;
  const seen = new Set();
  d.players.forEach(p => {
    if (p.id === myId) return; seen.add(p.id);
    let a = others.get(p.id);
    if (!a) { a = avatar(p.color, p.name, p.id); a.position.set(p.x, 0, p.z); scene.add(a); others.set(p.id, a); a.userData.sid = p.sid; a.userData.eid = p.eid; }
    a.tg = p; const u = a.userData;
    if (p.sid !== u.sid) { u.sid = p.sid; if (p.say) setBubble(a, p.say); }
    if (p.eid !== u.eid) { u.eid = p.eid; if (p.em) startEmote(a, p.em); }
  });
  others.forEach((a, id) => { if (!seen.has(id)) { scene.remove(a); others.delete(id); } });
};
setInterval(() => send({ t: 'pos', x: me.x, z: me.z, ry: me.ry }), 50);
function closeChat() { ci.value = ''; ci.blur(); ci.style.display = 'none'; }
addEventListener('keydown', e => {
  if (document.activeElement === ci) {
    if (e.key === 'Enter') { const t = ci.value.trim().slice(0, 40); if (t && mine) { send({ t: 'chat', text: t }); setBubble(mine, t); } closeChat(); }
    else if (e.key === 'Escape') closeChat();
    return;
  }
  if (e.key === 'Enter') { ci.style.display = 'block'; ci.focus(); for (const c in k) k[c] = 0; e.preventDefault(); return; }
  k[e.code] = 1;
  if (/^Digit[1-4]$/.test(e.code) && mine) { const n = +e.code.slice(5); send({ t: 'emote', e: n }); startEmote(mine, n); }
});
addEventListener('keyup', e => k[e.code] = 0);
let drag = null;
R.domElement.addEventListener('pointerdown', e => drag = e.clientX);
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (drag !== null) { cy -= (e.clientX - drag) * .006; drag = e.clientX; } });
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

function step(dt) {
  const ix = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0), iz = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
  cy += ((k.KeyQ ? 1 : 0) - (k.KeyE ? 1 : 0)) * 1.8 * dt;
  const s = Math.sin(cy), c = Math.cos(cy), l = Math.hypot(ix, iz) || 1, f = Math.min(1, dt * 10);
  me.vx += ((ix * c + iz * s) / l * 6 - me.vx) * f; me.vz += ((-ix * s + iz * c) / l * 6 - me.vz) * f;
  me.x += me.vx * dt; me.z += me.vz * dt; collide();
  if (Math.hypot(me.vx, me.vz) > .4) me.ry = Math.atan2(me.vx, me.vz);
}

const tmp = new THREE.Vector3(), nEl = document.getElementById('n');
let last = performance.now();
(function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  step(dt);
  if (mine) { mine.position.set(me.x, 0, me.z); mine.rotation.y = me.ry; anim(mine, Math.hypot(me.vx, me.vz), dt); fx(mine, dt); }
  others.forEach(a => {
    if (!a.tg) return; const px = a.position.x, pz = a.position.z;
    a.position.lerp(tmp.set(a.tg.x, 0, a.tg.z), .3); a.rotation.y = a.tg.ry;
    anim(a, Math.hypot(a.position.x - px, a.position.z - pz) / dt, dt); fx(a, dt);
  });
  nEl.textContent = (others.size + 1) + ' en línea';
  clouds.forEach(c => { c.position.x += dt * .8; if (c.position.x > 120) c.position.x = -120; });
  cam.position.lerp(tmp.set(me.x + Math.sin(cy) * 12, 9, me.z + Math.cos(cy) * 12), .12); cam.lookAt(me.x, 1, me.z);
  sun.position.set(me.x + 18, 32, me.z + 12); sun.target.position.set(me.x, 0, me.z);
  skyG.position.copy(cam.position);
  R.render(scene, cam);
})(last);
})();
</script></body></html>
