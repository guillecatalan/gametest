<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrera Loca</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden;background:#a9e4ff;font-family:'Fredoka',ui-rounded,system-ui,sans-serif}
#h{position:fixed;top:12px;left:0;right:0;text-align:center;font-weight:700;font-size:clamp(34px,7vw,64px);color:#fff;
 text-shadow:0 4px 0 #e8603c,0 8px 14px #0004;pointer-events:none}
#h.p{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
#r{position:fixed;top:14px;right:14px;background:#fffd;color:#243b53;font-weight:500;font-size:16px;line-height:1.5;
 padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 #0002;pointer-events:none}
#r:empty{display:none}
#c{position:fixed;bottom:12px;left:14px;color:#fff;font-weight:500;font-size:14px;text-shadow:0 2px 4px #0006}
</style></head><body>
<div id="h"></div><div id="r"></div><div id="c">WASD / flechas: mover · Espacio: saltar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SERVER = '';
const wsUrl = SERVER || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
const PL = [0, -21, -42, -63, -84], PW = 12, PD = 16;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd6f1ff, 60, 170);
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 260);
const R = new THREE.WebGLRenderer({ antialias: true });
R.setSize(innerWidth, innerHeight); R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.shadowMap.enabled = true;
document.body.appendChild(R.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fb0c8, .8));
const sun = new THREE.DirectionalLight(0xfff2d6, .85);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 });
scene.add(sun, sun.target);

const M = c => new THREE.MeshLambertMaterial({ color: c });
function tex(draw, w, h, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}
const checker = (a, b, rx, ry) => tex((x, w, h) => { x.fillStyle = a; x.fillRect(0, 0, w, h); x.fillStyle = b; x.fillRect(0, 0, w / 2, h / 2); x.fillRect(w / 2, h / 2, w / 2, h / 2); }, 64, 64, rx, ry);

// ---- Cielo, sol, nubes, agua, islas
const skyG = new THREE.Group(); scene.add(skyG);
skyG.add(new THREE.Mesh(new THREE.SphereGeometry(200, 16, 12), new THREE.MeshBasicMaterial({
  map: tex((x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#4fb7f5'); g.addColorStop(.55, '#a9e4ff'); g.addColorStop(.8, '#ffe9c2'); g.addColorStop(1, '#ffd1a1'); x.fillStyle = g; x.fillRect(0, 0, w, h); }, 2, 256),
  side: THREE.BackSide, fog: false, depthWrite: false })));
const sunB = new THREE.Mesh(new THREE.SphereGeometry(11, 20, 14), new THREE.MeshBasicMaterial({ color: 0xfff1a8, fog: false }));
sunB.position.set(70, 75, -120); skyG.add(sunB);
const halo = new THREE.Mesh(new THREE.SphereGeometry(18, 20, 14), new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: .25, fog: false }));
halo.position.copy(sunB.position); skyG.add(halo);

const clouds = [];
for (let i = 0; i < 16; i++) {
  const g = new THREE.Group(), s = 2 + Math.random() * 3;
  for (let j = 0; j < 4; j++) { const b = new THREE.Mesh(new THREE.SphereGeometry(s * (.6 + Math.random() * .5), 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); b.position.set(j * s * .9 - s * 1.4, Math.random() * s * .3, 0); b.scale.y = .65; g.add(b); }
  g.position.set((Math.random() < .5 ? -1 : 1) * (22 + Math.random() * 60), 12 + Math.random() * 20, 20 - Math.random() * 130);
  scene.add(g); clouds.push(g);
}
const waterTex = tex((x, w, h) => { x.fillStyle = '#22b5d8'; x.fillRect(0, 0, w, h); x.strokeStyle = '#7fe0f0'; x.lineWidth = 3; for (let i = 0; i < 14; i++) { x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 8 + Math.random() * 10, 0, Math.PI); x.stroke(); } }, 128, 128, 40, 40);
const water = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshLambertMaterial({ map: waterTex }));
water.rotation.x = -Math.PI / 2; water.position.set(0, -9, -42); water.receiveShadow = true; scene.add(water);

const isl = [];
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group(), r = 3 + (i * 7 % 4);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r * .9, .8, 14), M(0x79d86b)); g.add(top);
  const base = new THREE.Mesh(new THREE.ConeGeometry(r * .9, r * 1.4, 14), M(0xb07a52)); base.rotation.x = Math.PI; base.position.y = -.8 - r * .7 + .4; g.add(base);
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.18, .25, 1.2, 8), M(0x8a5a3a)); tr.position.y = 1; g.add(tr);
  const fo = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), M(i % 3 ? 0x2fb36b : 0xff9bb6)); fo.position.y = 2.2; fo.scale.y = 1.1; g.add(fo);
  g.traverse(o => o.castShadow = true);
  g.position.set((i % 2 ? 1 : -1) * (16 + (i * 5) % 14), -2 - (i % 3), 6 - i * 10); g.userData.y0 = g.position.y; g.userData.ph = i;
  scene.add(g); isl.push(g);
}

// ---- Pista
const pal = [['#8be8c4', '#6fd6b0', 0xffffff], ['#ffd3e0', '#ffb3c7', 0xff6f9c], ['#8be8c4', '#6fd6b0', 0xffffff], ['#ffd3e0', '#ffb3c7', 0xff6f9c], ['#ffe27a', '#ffc93c', 0xff6f9c]];
PL.forEach((z, i) => {
  const p = pal[i], side = M(0xc98d5b);
  const m = new THREE.Mesh(new THREE.BoxGeometry(PW, 1.4, PD), [side, side, new THREE.MeshLambertMaterial({ map: checker(p[0], p[1], PW / 2, PD / 2) }), side, side, side]);
  m.position.set(0, -.7, z); m.receiveShadow = true; m.castShadow = true; scene.add(m);
  [-1, 1].forEach(s => { const r = new THREE.Mesh(new THREE.BoxGeometry(.5, .08, PD), M(i % 2 ? 0xff6f9c : 0x35a7ff)); r.position.set(s * (PW / 2 - .25), .04, z); scene.add(r); });
});
const stripe = tex((x, w, h) => { x.fillStyle = '#ff4d4d'; x.fillRect(0, 0, w, h); x.fillStyle = '#fff'; x.fillRect(w / 4, 0, w / 4, h); x.fillRect(3 * w / 4, 0, w / 4, h); }, 64, 16, 5, 1);
const bars = [[1, 1.2], [2, -1.6], [3, 2]].map(([i, s]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(10, 1, .6), new THREE.MeshLambertMaterial({ map: stripe }));
  m.position.set(0, .5, PL[i]); m.castShadow = true;
  [-5, 5].forEach(x => { const c = new THREE.Mesh(new THREE.SphereGeometry(.45, 12, 10), M(0xffd54a)); c.position.x = x; m.add(c); });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.5, .6, 1.4, 12), M(0x6b7a8f)); pole.position.set(0, .7, PL[i]); pole.castShadow = true;
  scene.add(m, pole); return { m, z: PL[i], s, a: 0 };
});
const arch = new THREE.Group(), flag = new THREE.MeshLambertMaterial({ map: checker('#ffffff', '#222', 12, 2) });
[-5.5, 5.5].forEach(x => { const p = new THREE.Mesh(new THREE.BoxGeometry(.7, 6.5, .7), M(0xff6f9c)); p.position.set(x, 3.25, 0); arch.add(p); });
const top = new THREE.Mesh(new THREE.BoxGeometry(11.7, 1.3, .7), flag); top.position.y = 6.3; arch.add(top);
arch.position.z = -82; arch.traverse(o => o.castShadow = true); scene.add(arch);

// ---- Personajes
const HAT = [0xffd54a, 0xff6f9c, 0x35a7ff, 0xff9b3d, 0x7be0b0];
function avatar(color, name, id) {
  const g = new THREE.Group(), col = new THREE.Color(color), u = g.userData;
  u.body = new THREE.Mesh(new THREE.SphereGeometry(.5, 24, 18), M(col)); u.body.scale.set(1, 1.2, 1); u.body.position.y = .78; g.add(u.body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(.38, 16, 12), M(col.clone().offsetHSL(0, 0, .18))); belly.scale.set(1, 1.1, .5); belly.position.set(0, .7, .34); g.add(belly);
  [-.17, .17].forEach(x => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.13, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); e.scale.set(1, 1.2, .6); e.position.set(x, 1.08, .4); g.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0x111111 })); p.position.set(x, 1.08, .47); g.add(p);
  });
  const mo = new THREE.Mesh(new THREE.TorusGeometry(.1, .022, 6, 14, Math.PI), new THREE.MeshBasicMaterial({ color: 0x3a1f1f })); mo.rotation.z = Math.PI; mo.position.set(0, .93, .47); g.add(mo);
  const leg = x => { const p = new THREE.Group(); p.position.set(x, .32, 0); const f = new THREE.Mesh(new THREE.SphereGeometry(.17, 12, 10), M(0x2b2b3a)); f.scale.set(1, .7, 1.4); f.position.set(0, -.2, .06); p.add(f); g.add(p); return p; };
  const arm = x => { const p = new THREE.Group(); p.position.set(x, .98, 0); const h = new THREE.Mesh(new THREE.SphereGeometry(.13, 10, 8), M(col)); h.position.set(x > 0 ? .06 : -.06, -.34, 0); p.add(h); g.add(p); return p; };
  u.legL = leg(-.2); u.legR = leg(.2); u.armL = arm(-.52); u.armR = arm(.52);
  const hc = M(HAT[id % 5]), h = id % 5;
  if (h === 1) { const c = new THREE.Mesh(new THREE.ConeGeometry(.22, .55, 12), hc); c.position.set(0, 1.62, 0); c.rotation.z = .15; g.add(c); }
  if (h === 2) { const a = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .42, 14), M(0x2b2b3a)), b = new THREE.Mesh(new THREE.CylinderGeometry(.38, .38, .05, 16), M(0x2b2b3a)); a.position.y = 1.58; b.position.y = 1.38; g.add(a, b); }
  if (h === 3) { const s = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .2, 6), M(0x444444)); s.position.y = 1.48; u.prop = new THREE.Group(); u.prop.position.y = 1.6;
    [0, 1].forEach(k => { const bl = new THREE.Mesh(new THREE.BoxGeometry(.7, .03, .12), hc); bl.rotation.y = k * Math.PI / 2; u.prop.add(bl); }); g.add(s, u.prop); }
  if (h === 4) { const hm = new THREE.Mesh(new THREE.SphereGeometry(.53, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), hc); hm.position.y = 1.12; hm.scale.y = .9; g.add(hm); }
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const cx = cv.getContext('2d');
  cx.font = '700 38px Fredoka,system-ui'; cx.textAlign = 'center'; cx.lineWidth = 7; cx.strokeStyle = '#000a'; cx.strokeText(name, 128, 46); cx.fillStyle = '#fff'; cx.fillText(name, 128, 46);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); sp.scale.set(2.4, .6, 1); sp.position.y = 2.4; g.add(sp);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  u.ph = 0; u.az = 0; return g;
}
function anim(a, sp, gr, vy, dt) {
  const u = a.userData; u.ph += dt * (6 + sp * .9);
  const s = Math.min(1, sp / 9), sw = gr ? Math.sin(u.ph) * .9 * s : .6;
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw;
  u.armL.rotation.x = gr ? -sw * .8 : 0; u.armR.rotation.x = gr ? sw * .8 : 0;
  u.az += ((gr ? 0 : 2.3) - u.az) * Math.min(1, dt * 14);
  u.armL.rotation.z = -u.az; u.armR.rotation.z = u.az;
  const st = Math.max(-1, Math.min(1, vy / 12));
  u.body.scale.set(1 - st * .08, 1.2 + st * .1, 1 - st * .08); u.body.rotation.x = s * .15;
  if (u.prop) u.prop.rotation.y += dt * 20;
}

// ---- Confeti
const conf = [], cm = [0xff6f9c, 0xffd54a, 0x35a7ff, 0x7be0b0, 0xb66dff].map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })), cg = new THREE.PlaneGeometry(.2, .2);
function burst(x, y, z) { for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(cg, cm[i % 5]); m.position.set(x, y + 1.5, z); m.userData = { v: new THREE.Vector3((Math.random() - .5) * 10, 6 + Math.random() * 8, (Math.random() - .5) * 10), t: 3 }; scene.add(m); conf.push(m); } }

// ---- Estado y red
const me = { x: 0, y: 1, z: 4, vx: 0, vy: 0, vz: 0, g: false, cp: 0, ry: 0 };
let myId = null, mine = null, phase = 'lobby', el = 0, results = [], fin = false, off = 0;
const others = new Map(), k = {};
addEventListener('keydown', e => { k[e.code] = 1; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => k[e.code] = 0);
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
const name = (prompt('Tu nombre:') || '').slice(0, 12) || 'Anónimo';
const ws = new WebSocket(wsUrl), send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onopen = () => send({ t: 'join', name });
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.t === 'welcome') { myId = d.id; mine = avatar(d.color, name, d.id); scene.add(mine); toStart(); }
  if (d.t !== 's') return;
  off = d.now - Date.now(); el = d.el; results = d.results;
  if (d.phase !== phase) { phase = d.phase; fin = false; if (phase === 'countdown') toStart(); }
  const seen = new Set();
  d.players.forEach(p => {
    if (p.id === myId) return; seen.add(p.id);
    let a = others.get(p.id);
    if (!a) { a = avatar(p.color, p.name, p.id); a.position.set(p.x, p.y, p.z); scene.add(a); others.set(p.id, a); }
    a.tg = p;
  });
  others.forEach((a, id) => { if (!seen.has(id)) { scene.remove(a); others.delete(id); } });
};
setInterval(() => send({ t: 'pos', x: me.x, y: me.y, z: me.z, ry: me.ry }), 50);
function toStart() { me.x = (((myId || 0) % 6) - 2.5) * 1.6; me.z = 4; me.y = 1; me.vx = me.vy = me.vz = 0; me.cp = 0; }

function step(dt) {
  const now = (Date.now() + off) / 1000;
  bars.forEach(b => { b.a = now * b.s; b.m.rotation.y = -b.a; });
  const live = phase !== 'countdown';
  let ix = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0), iz = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
  if (!live) ix = iz = 0;
  const l = Math.hypot(ix, iz) || 1, c = Math.min(1, dt * (me.g ? 8 : 2.5));
  me.vx += (ix / l * 9 - me.vx) * c; me.vz += (iz / l * 9 - me.vz) * c;
  if (live && k.Space && me.g) { me.vy = 11; me.g = false; }
  me.vy -= 28 * dt; me.x += me.vx * dt; me.y += me.vy * dt; me.z += me.vz * dt;
  const pi = PL.findIndex(z => Math.abs(me.x) < PW / 2 && Math.abs(me.z - z) < PD / 2);
  me.g = false;
  if (pi >= 0 && me.y <= 0 && me.y > -.7 && me.vy <= 0) { me.y = 0; me.vy = 0; me.g = true; me.cp = pi; }
  if (live) bars.forEach(b => {
    const pz = me.z - b.z, ux = Math.cos(b.a), uz = Math.sin(b.a), t = Math.max(-5, Math.min(5, me.x * ux + pz * uz));
    const dx = me.x - ux * t, dz = pz - uz * t, d = Math.hypot(dx, dz);
    if (d < .9 && me.y < 1) { me.vx = dx / (d || 1) * 16; me.vz = dz / (d || 1) * 16; me.vy = Math.max(me.vy, 5); }
  });
  if (me.y < -12) { me.x = 0; me.z = PL[me.cp]; me.y = 1; me.vx = me.vy = me.vz = 0; }
  if (phase === 'go' && me.z < -82 && !fin) { fin = true; send({ t: 'finish' }); burst(me.x, me.y, me.z); }
  if (Math.hypot(me.vx, me.vz) > .5) me.ry = Math.atan2(me.vx, me.vz);
}

let lastTxt = '';
function hud() {
  const h = document.getElementById('h');
  const t = !mine ? 'Conectando…' : phase === 'lobby' ? 'Esperando jugadores…' : phase === 'countdown' ? String(Math.ceil(5 - el)) : phase === 'go' ? (el < 1.5 ? '¡YA!' : el.toFixed(1) + ' s') : 'Resultados';
  if (t !== lastTxt) { h.textContent = t; if (phase !== 'go' || el < 1.6) { h.classList.remove('p'); void h.offsetWidth; h.classList.add('p'); } lastTxt = t; }
  document.getElementById('r').innerHTML = results.map((r, i) => (['🥇', '🥈', '🥉'][i] || (i + 1) + '.') + ' ' + r.name.replace(/</g, '&lt;') + ' — ' + r.time + ' s').join('<br>');
}

const tmp = new THREE.Vector3();
let last = performance.now();
(function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  step(dt); hud();
  if (mine) { mine.position.set(me.x, me.y, me.z); mine.rotation.y = me.ry; anim(mine, Math.hypot(me.vx, me.vz), me.g, me.vy, dt); }
  others.forEach(a => {
    if (!a.tg) return;
    const px = a.position.x, py = a.position.y, pz = a.position.z;
    a.position.lerp(tmp.set(a.tg.x, a.tg.y, a.tg.z), .3);
    a.rotation.y = a.tg.ry;
    anim(a, Math.hypot(a.position.x - px, a.position.z - pz) / dt, Math.abs(a.position.y) < .06, (a.position.y - py) / dt, dt);
  });
  clouds.forEach(c => { c.position.x += dt * .6; if (c.position.x > 90) c.position.x = -90; });
  isl.forEach(g => { g.userData.ph += dt; g.position.y = g.userData.y0 + Math.sin(g.userData.ph) * .4; });
  waterTex.offset.x += dt * .01; waterTex.offset.y += dt * .006;
  for (let i = conf.length - 1; i >= 0; i--) { const c = conf[i], v = c.userData.v; v.y -= 14 * dt; c.position.addScaledVector(v, dt); c.rotation.x += dt * 6; c.rotation.z += dt * 4; if ((c.userData.t -= dt) < 0) { scene.remove(c); conf.splice(i, 1); } }
  cam.position.lerp(tmp.set(me.x * .6, me.y + 7, me.z + 11), .08);
  cam.lookAt(me.x * .6, me.y + 1, me.z - 6);
  sun.position.set(me.x + 14, me.y + 32, me.z + 10); sun.target.position.set(me.x, me.y, me.z);
  skyG.position.copy(cam.position);
  R.render(scene, cam);
})(last);
</script></body></html>
